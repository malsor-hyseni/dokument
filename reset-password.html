<!DOCTYPE html>
<html lang="sq" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fjalëkalim i ri · DOKUMENT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/env.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dokument.theme') || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body class="h-full font-sans antialiased bg-surface-muted">

  <main class="min-h-full flex flex-col">
    <header class="flex items-center justify-between p-5 sm:px-8">
      <a href="/login.html" class="flex items-center gap-2.5">
        <span class="w-7 h-7 rounded-md bg-accent flex items-center justify-center text-accent-ink">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
            <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
          </svg>
        </span>
        <span class="text-sm font-semibold tracking-[0.16em] text-ink">DOKUMENT</span>
      </a>
      <button type="button" id="theme-toggle" class="btn btn-ghost btn-icon btn-sm" aria-label="Ndrysho temën"></button>
    </header>

    <div class="flex-1 flex items-center justify-center px-5 pb-16">
      <div class="w-full max-w-[400px]">
        <div class="card card-pad">
          <div class="w-9 h-9 rounded-md bg-accent/10 text-accent flex items-center justify-center mb-4" id="page-icon"></div>
          <h1 class="text-xl font-semibold text-ink">Vendos fjalëkalim të ri</h1>
          <p class="mt-2 text-sm text-ink-muted leading-6">
            Zgjidhni një fjalëkalim të ri për llogarinë tuaj.
          </p>

          <div id="form-alert" class="mt-5" hidden></div>

          <form id="reset-form" class="mt-5 space-y-4" novalidate>
            <div>
              <label class="label" for="password">Fjalëkalimi i ri</label>
              <div class="relative">
                <input class="input pr-10" type="password" id="password" name="password"
                       autocomplete="new-password" placeholder="Së paku 8 karaktere" required minlength="8">
                <button type="button" data-toggle-password="password"
                        class="absolute right-1.5 top-1/2 -translate-y-1/2 btn btn-ghost btn-icon btn-sm"
                        aria-label="Shfaq fjalëkalimin"></button>
              </div>
              <div id="strength" class="mt-2.5" hidden>
                <div class="flex gap-1" aria-hidden="true">
                  <span class="h-1 flex-1 rounded-full bg-surface-inset transition-colors" data-bar="0"></span>
                  <span class="h-1 flex-1 rounded-full bg-surface-inset transition-colors" data-bar="1"></span>
                  <span class="h-1 flex-1 rounded-full bg-surface-inset transition-colors" data-bar="2"></span>
                  <span class="h-1 flex-1 rounded-full bg-surface-inset transition-colors" data-bar="3"></span>
                </div>
                <p class="mt-1.5 text-xs text-ink-subtle" data-strength-label></p>
              </div>
              <span class="field-error" data-error-for="password" hidden></span>
            </div>

            <div>
              <label class="label" for="password_confirm">Përsërit fjalëkalimin</label>
              <input class="input" type="password" id="password_confirm" name="password_confirm"
                     autocomplete="new-password" placeholder="••••••••" required>
              <span class="field-error" data-error-for="password_confirm" hidden></span>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Ruaj fjalëkalimin</button>
          </form>
        </div>

        <p class="mt-5 text-center text-sm text-ink-muted">
          <a href="/login.html" class="link">Kthehu te kyçja</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
